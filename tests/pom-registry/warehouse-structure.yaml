# POM Element Registry — Warehouse Structure (SCM Master)
# Sumber: olshoperp-frontend SCM/master/Warehouse/Form.vue + DataList.vue + WarehouseStructureTable.vue
# Route: /supplychain/warehouse-structure · API: /supplychain/warehouse

menu: supplychain-warehouse-structure
menu_name: Warehouse Structure
route: /supplychain/warehouse-structure
create_button_mode: link
pom_helper: tests/helpers/warehouse-structure.ts
company_default: lumicharmsid

elements:
  create_button:
    strategy: role
    role: link
    name: Create

  code:
    strategy: id
    value: code

  name:
    strategy: id
    value: name

  parent_group:
    strategy: aria-placeholder
    value: Choose Parent

  type:
    strategy: aria-placeholder
    value: Choose Type

  drop_off_switch:
    strategy: label
    value: Drop Off
    note: "Visible on create only (v-show=!id)"

  active_switch:
    strategy: label
    value: Active

  show_for_all_company:
    strategy: label
    value: Show for all company
    note: "Visible only when parent_id empty"

  save_and_next:
    strategy: role
    role: button
    name: Save & Next
    position: last

  save_all:
    strategy: role
    role: button
    name: Save All
    position: last

  edit_button:
    strategy: id
    value: updateButton

  child_warehouse_generator_section:
    strategy: id
    value: WarehouseGenerator
    note: "Accordion create-only (v-if=!is_edit). Label: Child Warehouse Generator"

  generator_warehouse_level:
    strategy: aria-placeholder
    value: Warehouse Level
    note: "Per baris generator"

  generator_prefix:
    strategy: placeholder
    value: Prefix

  generator_amount:
    strategy: placeholder
    value: Amount

  generator_prefix_type:
    strategy: css
    value: "#WarehouseGenerator .grid.grid-cols-12 .multiselect:last-child"
    note: "ETM-8618: tiap baris. Buka via caret/label kiri field. Default Numeric."

  generator_add_row_button:
    strategy: css
    value: "#WarehouseGenerator button[type='button']"
    note: "Icon tambah baris — di sebelah Amount baris pertama"

gotchas:
  - "Generator hanya di create. Drop Off OFF untuk TC ETM-8618."
  - "WAJIB isi Code + Name + Type (Basic Information) dulu — generator disabled sampai Type terpilih."
  - "Prefix teks harus unique + alphabet (V-07). Prefix Type (Numeric/Alphabet) independen per level setelah ETM-8618."
  - "Prefix Type: klik caret/label multiselect (kiri field search) lalu pilih Numeric/Alphabet."
  - "Job WarehouseGeneratorV2 async — tunggu child muncul via select2/datalist."
