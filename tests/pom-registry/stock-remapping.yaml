# POM Element Registry — Stock Remapping (FA)
# Route: /accounting/stock-remapping · prefix RM-
company_default: DEV-STG

elements:
  create:
  create_button:
  code:
    strategy: id
    value: code
    placeholder: Generated After Saved
  building:
    strategy: aria-placeholder
    value: Choose Building
  description:
    strategy: placeholder
    value: Add description or notes...
  status_open:
    strategy: id
    value: open
  status_draft:
    strategy: id
    value: draft
  save_all:
    strategy: role
    role: button
    name: Save All
  detail_section:
    strategy: disclosure
    name: Stock Remapping Detail
  select_product:
    strategy: aria-placeholder
    value: Select Product
  warehouse_origin:
    strategy: aria-placeholder
    value: Choose Warehouse
    fallback:
      - Choose Building
      - Lobby Tanrise
  remapped_to:
    strategy: aria-placeholder
    value: Choose Product
    notes: Kolom Remapped To di detail / modal Use Product
  approve:
    strategy: role
    role: button
    name: Approve
  import:
    strategy: role
    role: button
    name: Import
    scope: Stock Remapping Detail

gotchas:
  - Modal Available Products sudah 1 baris per Stock ID (DEV-STG: 534154=13, 534155=2)
  - Tombol Use = class use-button / a11y "Direct Use availableProductIvOut" (kolom action DataTables)
  - Qty Availability di kolom Pieces — jangan parse Stock ID sebagai qty
  - Approve wajib hitung reserved milik dokumen ini sebagai stok sah (ETM-15584 / GAP-RM-03)
  - Origin & Remapped To harus variant 1 parent
  - Error bug: "Insufficient stock. SKU Origin ... only has 0 base units available for the selected stock."

notes:
  - "Create sering auto-redirect ke edit (fetchDefaultValues)."
  - "Self-remap Origin = Remapped To harus ditolak di insert/update/qty/approve (ETM-15526 TC-13)."
  - "Inline edit Remapped To tidak boleh mengubah urutan baris (TC-14)."
  - "Import error: failed row = jumlah baris gagal; Qty non-numerik ditolak; semua required error tampil (TC-15)."
